# Purpose: Static-analysis scan of the action on the org SonarCloud.

name: sonar
on:
  push:
    branches:
      - main
  pull_request: {}
jobs:
  sonar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Install sonar-scanner
        id: install_sonar-scanner
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip"
          echo "bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b  /tmp/sonar-scanner.zip" | sha256sum -c -
          unzip -q /tmp/sonar-scanner.zip -d /tmp
          echo "/tmp/sonar-scanner-8.1.0.6389-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Scan
        id: scan
        run: |-
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=auto-commit \
            -Dsonar.projectVersion="$(git describe --tags --always)" \
            -Dsonar.inclusions=.github/workflows/**,action.yml,**/*.sh \
            -Dsonar.qualitygate.wait=true
