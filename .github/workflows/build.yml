# Purpose: Lint gate for the action (shellcheck, yamllint, actionlint).

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: lint
        id: lint
        run: npx projen@0.103.25 lint
