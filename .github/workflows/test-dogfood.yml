# Purpose: End-to-end dogfood test running the action against this repo.

name: test-dogfood
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  schedule:
    - cron: 17 3 * * *
jobs:
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: "Changed path: fixture"
        id: changed_path_fixture
        run: echo "$(date -u +%Y%m%dT%H%M%SZ)" >> test/fixtures/dogfood-state.txt
      - name: "Changed path: run the action"
        id: changed-path-0
        uses: ./
        with:
          commit_message: "test: dogfood"
          branches: test/dogfood
      - name: "Changed path: assert"
        id: changed_path_assert
        run: |-
          set -euo pipefail
          [ "${{ steps.changed-path-0.outputs.committed }}" = "true" ]
      - name: "No-op path: run the action"
        id: no-op-check
        uses: ./
        with:
          commit_message: "test: dogfood"
          branches: test/dogfood
      - name: "No-op path: assert"
        id: no-op_path_assert
        run: |-
          set -euo pipefail
          [ "${{ steps.no-op-check.outputs.committed }}" = "false" ]
      - name: "Skip path: fixture"
        id: skip_path_fixture
        run: |-
          set -euo pipefail
          adv="$(mktemp -d)"
          # Authenticate the scratch clone explicitly with GITHUB_TOKEN. Cloning the
          # workspace origin (git remote get-url origin) does not carry the checkout
          # credential into a fresh clone in /tmp, so the advance push died with:
          #   fatal: could not read Username for 'https://github.com'
          host="${GITHUB_SERVER_URL#https://}"
          git clone -q "https://x-access-token:${GITHUB_TOKEN}@${host}/${GITHUB_REPOSITORY}" "$adv"
          (
            cd "$adv"
            git config user.name "dogfood-advance"
            git config user.email "dogfood@example.com"
            git checkout -q test/dogfood
            echo "advance $(date -u +%s)" >> test/fixtures/dogfood-state.txt
            git add -A
            git commit -qm "dogfood: advance test/dogfood"
            git push -q origin HEAD:refs/heads/test/dogfood
          )
          rm -rf "$adv"
          echo "skip $(date -u +%s)" >> test/fixtures/dogfood-skip.txt
      - name: "Skip path: run the action"
        id: skip-path
        uses: ./
        with:
          commit_message: "test: dogfood"
          branches: test/dogfood
          if_behind: skip
      - name: "Skip path: assert"
        id: skip_path_assert
        run: |-
          set -euo pipefail
          [ "${{ steps.skip-path.outputs.committed }}" = "true" ]
          [ "${{ steps.skip-path.outputs.pushed }}" = "false" ]
          [ "${{ steps.skip-path.outputs.skipped_branches }}" = "test/dogfood" ]
      - name: Cleanup
        id: cleanup
        if: always()
        run: git push origin --delete test/dogfood || true
